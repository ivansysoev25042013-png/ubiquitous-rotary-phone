b.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{if(b.dataset.done==='1')return;b.dataset.done='1';const ok=btn.dataset.v===p.y;if(ok){score++;upd()}
document.getElementById('yf').innerHTML=ok?'<span class="ok">Верно!</span>':'<span class="bad">Нет, правильный ответ: '+p.y+'</span>'});b.dataset.done='0'}
function newPQ(){const p=rnd(all);const others=shuf(all.filter(x=>x.y!==p.y)).slice(0,3);const opts=shuf([p,...others]);const b=document.getElementById('pqb');
b.innerHTML='<p>Кто из них выпустился в <b>'+p.y+'</b> году?</p>'+opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(full(o))+'</button>').join('')+'<p id="pf" aria-live="polite"></p>';b.dataset.done='0';
b.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{if(b.dataset.done==='1')return;b.dataset.done='1';const o=opts[+btn.dataset.k];const ok=o===p;if(ok){score++;upd()}
document.getElementById('pf').innerHTML=ok?'<span class="ok">Верно!</span>':'<span class="bad">Нет. Правильно: '+esc(full(p))+' ('+esc(full(o))+' — выпуск '+o.y+')</span>'})}
function renderArch(){const y=ay.value;document.getElementById('ab').innerHTML='<ol>'+DATA[y].map(p=>'<li>'+esc([p[0],p[1],p[2]].filter(Boolean).join(' '))+'</li>').join('')+'</ol>'}
</script></body></html>
